resources:
  jobs:
    phase0_setup_job:
      name: ${bundle.target}_phase0_setup
      description: >-
        Creates the bronze/silver/gold/policy/ops schemas and the policy_pdfs /
        committee_memos volumes in the target catalog, then proves Delta
        read/write access with a throwaway table. Re-runnable — every step is
        idempotent (CREATE ... IF NOT EXISTS).
      tasks:
        - task_key: setup_and_smoke_test
          notebook_task:
            notebook_path: ../notebooks/00_setup_and_smoke_test.py
            base_parameters:
              catalog_name: ${var.catalog_name}
      tags:
        project: credit_platform
        environment: ${bundle.target}

    phase2_policy_intelligence_job:
      name: ${bundle.target}_phase2_policy_intelligence
      description: >-
        Authors the dummy policy PDFs + committee memos and uploads them to
        the policy Volumes, then parses them with ai_parse_document, chunks
        the policy text into gold.policy_chunks, builds gold.committee_memos,
        creates/syncs the Vector Search Delta Sync index over
        gold.policy_chunks, and registers retrieve_policy + get_committee_memos.
        Re-runnable. Caveat on a fresh catalog's first run: a brand-new Vector
        Search index can take 15-30 minutes to finish provisioning, so
        register_policy_functions may fail the first time with the index not
        yet ready — re-run just that task once
        `databricks vector-search-indexes get-index <catalog>.gold.policy_chunks_index`
        reports `"ready": true`.
      tasks:
        - task_key: generate_policy_documents
          notebook_task:
            notebook_path: ../data_generation/02_generate_policy_documents.py
            base_parameters:
              catalog_name: ${var.catalog_name}
        - task_key: ingest_policy_and_memos
          depends_on:
            - task_key: generate_policy_documents
          notebook_task:
            notebook_path: ../pipelines/policy_ingestion.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              vector_search_endpoint_name: ${var.vector_search_endpoint_name}
        - task_key: register_policy_functions
          depends_on:
            - task_key: ingest_policy_and_memos
          notebook_task:
            notebook_path: ../data_generation/03_register_policy_functions.py
            base_parameters:
              catalog_name: ${var.catalog_name}
      tags:
        project: credit_platform
        environment: ${bundle.target}

    phase3_rules_engine_job:
      name: ${bundle.target}_phase3_rules_engine
      description: >-
        Runs the pure-Python deterministic rules engine (engine/) against real
        gold.applications / gold.borrower_360 / gold.policy_rules data for
        APP-001, and writes the result to ops.assessment_results. The engine's
        own correctness is proven locally by engine/tests/test_golden_cases.py
        (no Databricks dependency); this job proves the same engine also works
        end-to-end against the live catalog. Re-runnable — appends a new row
        to ops.assessment_results each run rather than overwriting history.
      tasks:
        - task_key: run_assessment
          notebook_task:
            notebook_path: ../pipelines/run_assessment.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              application_id: APP-001
      tags:
        project: credit_platform
        environment: ${bundle.target}

    phase1_foundation_job:
      name: ${bundle.target}_phase1_foundation
      description: >-
        Generates the ~200-borrower synthetic pool (bronze -> silver -> gold,
        including the fixed Meera Textiles reference borrower and the APP-001
        reference application), then registers the 4 Phase-1 UC Functions.
        Re-runnable — data generation uses a fixed random seed and every write
        is overwrite/CREATE OR REPLACE.
      tasks:
        - task_key: generate_dummy_data
          notebook_task:
            notebook_path: ../data_generation/00_generate_dummy_data.py
            base_parameters:
              catalog_name: ${var.catalog_name}
        - task_key: register_uc_functions
          depends_on:
            - task_key: generate_dummy_data
          notebook_task:
            notebook_path: ../data_generation/01_register_uc_functions.py
            base_parameters:
              catalog_name: ${var.catalog_name}
      tags:
        project: credit_platform
        environment: ${bundle.target}
